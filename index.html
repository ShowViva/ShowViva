<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062a3c">
<title>ShowViva — Your Equestrian Show Planner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#062a3c;overflow-x:hidden}
body{-webkit-font-smoothing:antialiased}
.page{position:relative;width:100%;max-width:828px;margin:0 auto}
.page img{display:block;width:100%;height:auto;margin:0}
.hotspot{position:absolute;display:block;z-index:5;border:0;background:transparent;
         -webkit-tap-highlight-color:transparent;cursor:pointer}
/* Exact transparent hit areas over the approved artwork */
.menu{left:2.5%;top:2.2%;width:11%;height:4%}
.get{left:4.7%;top:45.5%;width:58%;height:5.7%}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
       padding:24px;background:rgba(2,22,33,.82);backdrop-filter:blur(5px)}
.modal.show{display:flex}
.box{position:relative;width:min(88vw,390px);padding:38px 25px 32px;text-align:center;
     border:1px solid #d6a957;border-radius:22px;background:#062a3c;color:#fff;
     box-shadow:0 18px 55px rgba(0,0,0,.35);font-family:Arial,sans-serif}
.shield{width:58px;height:70px;margin:0 auto 18px;border:2px solid #d6a957;border-radius:2px 2px 26px 26px;
        display:flex;align-items:center;justify-content:center;color:#d6a957;font:28px Georgia,serif}
.box h2{margin:0 0 10px;font:34px Georgia,serif;color:#fff}
.box p{margin:0;line-height:1.55;color:#f5ead8}
.close{position:absolute;right:12px;top:8px;border:0;background:none;color:#fff;font-size:30px;cursor:pointer}
</style>
</head>
<body>
<main class="page">
  <img src="showviva-mobile-final.png" alt="ShowViva — Your Equestrian Show Planner">
  <button class="hotspot menu" data-coming aria-label="Menu"></button>
  <button class="hotspot get" data-coming aria-label="Get ShowViva"></button>
</main>
<div class="modal" id="comingSoon" role="dialog" aria-modal="true" aria-labelledby="soonTitle">
 <div class="box">
  <button class="close" aria-label="Close">×</button>
  <div class="shield">SV</div>
  <h2 id="soonTitle">Coming soon.</h2>
  <p>A smoother show day is coming.<br>ShowViva is nearly ready.</p>
 </div>
</div>
<script>
const modal=document.getElementById('comingSoon');
document.querySelectorAll('[data-coming]').forEach(x=>x.addEventListener('click',()=>modal.classList.add('show')));
document.querySelector('.close').addEventListener('click',()=>modal.classList.remove('show'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show')});
</script>
</body>
</html>
