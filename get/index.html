<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061f30"><title>Choose your ShowViva | ShowViva</title><style>
:root{--navy:#061f30;--cream:#f6f1e8;--gold:#c4a064;--gold-edge:#d7be8a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:var(--navy);padding:24px 20px;text-align:center}.brand{font:700 35px Georgia,serif;color:#fff;text-decoration:none}.brand span{color:#dda94e}main{width:min(760px,calc(100% - 32px));margin:48px auto 80px}.back{color:var(--navy);display:inline-block;margin-bottom:28px}.eyebrow{letter-spacing:.2em;color:#a17b38;font-weight:700;font-size:11px}h1{font:500 clamp(40px,7vw,62px)/1 Georgia,serif;margin:12px 0}p{line-height:1.6}.banner{background:var(--gold);border-radius:15px;padding:23px;text-align:center;margin:28px 0}.banner strong{font:600 26px Georgia,serif}.banner p{margin:8px 0 0}.plans{display:grid;gap:12px}.choice{border:1px solid var(--gold-edge);border-radius:15px;padding:20px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;cursor:pointer;color:var(--navy);font:inherit;width:100%}.choice[aria-pressed=true]{border:2px solid #a17b38;background:#fff9ec}.choice span{font:500 25px Georgia,serif}.choice strong{font:600 27px Georgia,serif;color:#a17b38}.choice small{font-size:12px;letter-spacing:.11em;color:#9b783e;grid-column:1/-1}.pricing-foot{text-align:center;margin:26px 0 10px;font-weight:600;font-size:15px}.selected{margin:16px 0 0;text-align:center;font-size:14px;color:var(--navy)}.choice .choose{grid-column:1/-1;display:block;background:var(--navy);color:#fff;border-radius:9px;padding:12px 16px;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;text-align:center;letter-spacing:0}footer{text-align:center;padding:30px;font-size:12px;letter-spacing:.15em}button:focus-visible,a:focus-visible{outline:3px solid #c4a064;outline-offset:4px}@media(max-width:430px){main{margin-top:30px}.choice span{font-size:22px}.choice strong{font-size:24px}}</style></head><body><header><a class="brand" href="/">Show<span>Viva</span></a></header><main><a href="/#pricing" class="back">← Back to pricing</a><div class="eyebrow">SHOWVIVA</div><h1>Choose your ShowViva.</h1><p>One price. Your whole show.</p><div class="banner"><strong>LAUNCH PRICE</strong><p>Exclusive introductory pricing for a limited time.</p></div><div class="plans" role="group" aria-label="Choose number of horses"><button type="button" class="choice" data-plan="individual" aria-pressed="false"><small>INDIVIDUAL</small><span>1 horse</span><strong>£4.99</strong><span class="choose">Choose this plan →</span></button><button type="button" class="choice" data-plan="small-team" aria-pressed="false"><small>SMALL TEAM</small><span>2–3 horses</span><strong>£9.99</strong><span class="choose">Choose this plan →</span></button><button type="button" class="choice" data-plan="professional-yard" aria-pressed="false"><small>PROFESSIONAL YARD &amp; TEAM</small><span>4+ horses</span><strong>£14.99</strong><span class="choose">Choose this plan →</span></button></div><p class="pricing-foot">All features included. Unlimited riders. One shareable link.</p><p class="selected" id="status" role="status" aria-live="polite" hidden></p></main><footer>YOUR SHOW. YOUR VIEW.</footer><script>
const plans={individual:'1 horse · £4.99','small-team':'2–3 horses · £9.99','professional-yard':'4+ horses · £14.99'};
const buttons=[...document.querySelectorAll('.choice')];const status=document.getElementById('status');
function choose(id){if(!Object.prototype.hasOwnProperty.call(plans,id))return;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.plan===id)));status.hidden=false;status.textContent='Selected: '+plans[id];history.replaceState(null,'',location.pathname+'?plan='+encodeURIComponent(id));}
buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.plan)));choose(new URLSearchParams(location.search).get('plan'));
</script></body></html>
