
name: ShowViva Browser Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Find Claire Lewis entries
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 }
            });

            try {
              await page.goto(
                'https://online.equipe.com/shows/76890',
                { waitUntil: 'domcontentloaded', timeout: 30000 }
              );

              await page.getByText('Riders', {
                exact: true
              }).first().click();

              await page.getByText('Claire Lewis', {
                exact: true
              }).first().click();

              await page.waitForTimeout(1500);

              const result = {
                show: 'Onley Grounds',
                rider: 'Claire Lewis',
                sourceUrl: page.url(),
                capturedAt: new Date().toISOString(),
                visiblePageText: await page.locator('body').innerText()
              };

              fs.writeFileSync(
                'claire-lewis-test.json',
                JSON.stringify(result, null, 2)
              );

              console.log(result.visiblePageText);

              await page.screenshot({
                path: 'claire-lewis-test.png',
                fullPage: true
              });

            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claire-lewis-test
          path: |
            claire-lewis-test.json
            claire-lewis-test.png
          if-no-files-found: warn
