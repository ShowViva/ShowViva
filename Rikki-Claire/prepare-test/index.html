 if(!teamReady||teamError)return;

 app.innerHTML='<div class="empty">Connecting to your shared team…</div>';

 try{

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});const dates=s=>fmt(s.start)+(s.end&&s.end!==s.start?' – '+fmt(s.end):'');const riderName=r=>typeof r==='string'?r:r.name;const horseName=h=>typeof h==='string'?h:(h.stableName||h.registeredName);const registeredName=h=>typeof h==='string'?h:h.registeredName;const todayISO=()=>new Date().toLocaleDateString('en-CA');const isPast=s=>s.end<todayISO();const ordered=()=>[...data.shows].sort((a,b)=>a.start.localeCompare(b.start));const creationMonth=()=>todayISO().slice(0,7);const monthlyCount=()=>data.plannerCreations.filter(m=>m===creationMonth()).length;const statusLabel=s=>isPast(s)?'Past show':s.status==='ready'?'Planner ready':s.status==='preparing'?'Planner being prepared':s.status==='submitted'?'Planner requested':'Show details';const showItem=s=>`<button class="item" onclick="openShow(${s.id})"><span><strong>${esc(s.name)}</strong><small>${dates(s)} · ${statusLabel(s)}</small></span><span class="arrow">›</span></button>`;const back=()=>`<button class="back" onclick="go('home')">← Home</button>`;function go(v){view=v;render();scrollTo(0,0)}function openShow(id){activeTool=null;selected=Number(id);go('show')}function render(){app.className='sv-view-'+view;document.querySelector('.site-header')?.classList.toggle('sv-header-home',view==='home');const homeNav=document.querySelector('.home-nav');if(homeNav)homeNav.hidden=(view==='home');if(view==='confirmed'){const s=data.shows.find(x=>x.id===selected);app.innerHTML=`<div class="confirmation"><div class="eyebrow">Your ShowViva</div><h1>Planner requested ✓</h1><p class="intro">${s?esc(s.name):'Your show'} is saved. You can track its planner status from Home and My Shows.</p><button class="goldbtn" onclick="go('home')">Go to Home →</button><button class="smallbtn" onclick="go('show')">View request →</button></div>`;return}if(view==='home'){const shows=ordered().filter(s=>!isPast(s)),next=shows[0];app.innerHTML=`<div class="eyebrow">Your ShowViva</div><h1 class="home-title">Everything for your next show.</h1><div class="tiles home-actions"><button class="tile" onclick="go('add')"><span class="symbol">＋</span><strong>Add Show</strong><small>Get planning →</small></button><button class="tile" onclick="go('team')"><span class="symbol">♧</span><strong>My Team</strong><small>Horses &amp; riders →</small></button></div>${next?`<section class="next" aria-label="Up next"><div class="eyebrow">★ Up next</div><h2>${esc(next.name)}</h2><p>${dates(next)} · ${statusLabel(next)}</p>${next.status==='submitted'?'<p class="next-support">Request received. Your planner will appear here when ready.</p>':next.status==='preparing'?'<p class="next-support">Your planner is being prepared. Check here for its availability.</p>':''}<button class="goldbtn" onclick="${next.status==='ready'&&Number(next.id)===1?'window.location.href=&quot;planner.html&quot;':'openShow('+next.id+')'}">${next.status==='ready'&&Number(next.id)===1?'Open Planner →':next.status==='draft'?'Finish show details →':next.status==='submitted'?'Track planner request →':'View show →'}</button></section>`:''}<div class="sectionhead"><h2>My Shows</h2><button class="link" onclick="mode='list';go('plan')">View all →</button></div>${shows.filter(s=>s.id!==next?.id).slice(0,5).map(showItem).join('')||'<p class="hint">No other upcoming shows.</p>'}`}
else if(view==='past'){app.innerHTML=`${back()}<h1>Past Shows</h1><p class="intro">Your previous shows, all in one place.</p>${ordered().filter(isPast).reverse().map(showItem).join('')||'<p class="empty">No past shows yet.</p>'}`}
else if(view==='plan'){app.innerHTML=`${back()}<h1>My Shows</h1><p class="intro">Plan your shows and find every planner here.</p><div class="toolbar"><button class="smallbtn" onclick="go('add')">+ Add Show</button><div class="toggle"><button class="${mode==='calendar'?'active':''}" onclick="mode='calendar';render()">Calendar</button><button class="${mode==='list'?'active':''}" onclick="mode='list';render()">List</button></div></div>${mode==='calendar'?calendar():''}<h2 class="calendar-section-title">Upcoming Shows</h2>${ordered().filter(s=>!isPast(s)).map(showItem).join('')||'<p class="empty">No upcoming shows.</p>'}<h2 class="calendar-section-title past">Past Shows</h2>${ordered().filter(isPast).reverse().map(showItem).join('')||'<p class="empty">No past shows yet.</p>'}`}
else if(view==='team'){app.innerHTML=`${back()}<div class="sv-branch-intro"><div class="sv-eyebrow">YOUR SHOWVIVA</div><h1>My Team</h1><p class="intro">Your horses and riders, ready for every competition.</p></div><h2 class="subhead">My Horses</h2>${data.horses.map((h,i)=>`<button class="horsecard" onclick="editHorse(${i})"><strong>${esc(horseName(h))}</strong><small>${esc(registeredName(h))}${typeof h==='object'&&h.ueln?' · UELN '+esc(h.ueln):''} · Edit →</small></button>`).join('')||'<p class="hint">No horses added yet.</p>'}<button class="smallbtn" onclick="editingHorse=null;go('horse')">+ Add Horse</button><h2 class="subhead">My Riders</h2>${data.riders.map((r,i)=>`<button class="horsecard" onclick="editingRider=${i};go('rider')"><strong>${esc(riderName(r))}</strong><small>${typeof r==='object'&&r.bs?'BS '+esc(r.bs)+' · ':''}${typeof r==='object'&&r.fei?'FEI '+esc(r.fei)+' · ':''}Edit →</small></button>`).join('')||'<p class="hint">No riders added yet.</p>'}<button class="smallbtn" onclick="editingRider=null;go('rider')">+ Add Rider</button>`}
else if(view==='rider'){const r=editingRider===null?{}:data.riders[editingRider]||{},o=typeof r==='string'?{name:r}:r;app.innerHTML=`<button class="back" onclick="go('team')">← My Team</button><div class="sv-branch-intro"><div class="sv-eyebrow">MY TEAM · RIDER</div><h1>${editingRider===null?'Add Rider':'Edit Rider'}</h1></div><form onsubmit="saveRider(event)"><label class="field">Rider name<input name="name" required maxlength="80" value="${esc(o.name||'')}"></label><label class="field">British Showjumping (BS) membership number (optional)<input name="bs" maxlength="60" value="${esc(o.bs||'')}"></label><label class="field">FEI ID (optional)<input name="fei" maxlength="60" value="${esc(o.fei||'')}"></label><button class="goldbtn">Save Rider →</button></form>${editingRider!==null?`<button type="button" class="sv-delete-team" onclick="deleteRider()">Delete rider</button>`:``}`}
else if(view==='horse'){const h=editingHorse===null?{}:data.horses[editingHorse]||{},obj=typeof h==='string'?{registeredName:h}:h;const field=(label,name,type='text',required=false)=>`<label class="field">${label}<input name="${name}" type="${type}" ${required?'required':''} value="${esc(obj[name]||'')}" ${type==='text'?'maxlength="100"':''}></label>`;app.innerHTML=`<button class="back" onclick="go('team')">← My Team</button><div class="sv-branch-intro"><div class="sv-eyebrow">MY TEAM · HORSE</div><h1>${editingHorse===null?'Add Horse':'Edit Horse'}</h1></div><div class="scanrow"><label for="passport-photo" class="scan-trigger" aria-label="Tap to scan passport details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></label><label for="passport-photo" class="scan-label">Tap to scan passport details</label><input class="scan-file" id="passport-photo" type="file" accept="image/*" capture="environment" onchange="passportSelected(this)"></div><p id="scanstatus" class="scan-status" role="status"></p><img id="passport-preview" class="scan-preview" alt="Selected passport photo" hidden><p class="hint">Or enter details manually</p><form onsubmit="saveHorse(event)">${field('Registered name','registeredName','text',true)}${field('Stable name','stableName')}${field('Passport / UELN number','ueln')}${field('Last vaccination date','vaccination','date')}${field('FEI registration number','fei')}${field('British Showjumping (BS) number','bs')}<p class="hint">Only registered name is required. Check all details against the passport before saving.</p><button class="goldbtn">Save Horse →</button></form>${editingHorse!==null?`<button type="button" class="sv-delete-team" onclick="deleteHorse()">Delete horse</button>`:``}`}
else if(view==='add'){app.innerHTML=`<button class="back" onclick="go('home')">← Home</button><div class="sv-branch-intro"><div class="sv-eyebrow">YOUR NEXT SHOW</div><h1>Add Show</h1><p class="intro">Where are you competing?</p></div><p class="hint">${monthlyCount()} of 4 planners created this month.</p><form onsubmit="addShow(event)"><label class="field">Show name<input name="name" required maxlength="100" placeholder="Competition name"></label><label class="field">Show venue<input name="venue" required maxlength="150" placeholder="Where is the show?"></label><label class="field">Start date<input name="start" type="date" required></label><label class="field">End date<input name="end" type="date" required></label><label class="field">Show link (optional)<input name="showLink" type="url" placeholder="https://…"><small>Paste a show, entries or timetable link. You can add this later.</small></label><h2 class="subhead">Horses</h2>${data.horses.map(h=>`<label class="checkrow"><input type="checkbox" name="horses" value="${esc(registeredName(h))}"><span>${esc(horseName(h))}</span></label>`).join('')||'<p class="hint">Add horses in My Team first.</p>'}<h2 class="subhead">Riders</h2>${data.riders.map(r=>`<label class="checkrow"><input type="checkbox" name="riders" value="${esc(riderName(r))}"><span>${esc(riderName(r))}</span></label>`).join('')||'<p class="hint">Add riders in My Team first.</p>'}<button class="goldbtn">Submit Show →</button></form>`}

else if(view==='show'){const s=data.shows.find(x=>x.id===selected);if(!s){go('home');return}const draft=s.status==='draft';app.innerHTML=`<button class="back" onclick="go('home')">← Home</button><div class="show-top"><div><div class="eyebrow">Your show</div><h1>${esc(s.name)}</h1><p class="intro">${dates(s)}</p>${isPast(s)?'<span class="past-label">Past Show</span>':''}</div></div>${!draft&&!isPast(s)?`<div class="notice">${s.status==='ready'?'Planner ready':s.status==='preparing'?'Planner being prepared':'Planner requested'}</div>`:''}<form onsubmit="saveShowDetails(event)"><label class="field">Show venue<input name="venue" maxlength="150" required value="${esc(s.venue||'')}"></label><h2 class="subhead">Horses</h2>${data.horses.map(h=>{const n=registeredName(h);return `<label class="checkrow"><input type="checkbox" name="horses" value="${esc(n)}" ${s.horses.includes(n)?'checked':''}><span>${esc(horseName(h))}</span></label>`}).join('')||'<p class="hint">Add horses in My Team first.</p>'}<h2 class="subhead">Riders</h2>${data.riders.map(r=>{const n=riderName(r);return `<label class="checkrow"><input type="checkbox" name="riders" value="${esc(n)}" ${s.riders.includes(n)?'checked':''}><span>${esc(n)}</span></label>`}).join('')||'<p class="hint">Add riders in My Team first.</p>'}<label class="field">Show link (optional)<input name="showLink" type="url" placeholder="https://…" value="${esc(s.showLink||'')}"><small>Paste a show, entries or timetable link. You can add this later.</small></label><button class="goldbtn" type="submit">${draft?'Submit Show →':'Save changes →'}</button></form>${!draft&&!isPast(s)?`<section class="show-journey">${s.status==='ready'&&Number(s.id)===1?'<button class="goldbtn" onclick="window.location.href=\'planner.html\'">Open Planner →</button>':s.status==='ready'?'<p>Planner marked ready. Your personal planner link will appear here once it is connected.</p>':s.status==='submitted'?'<p>Your planner request is received. Your planner will appear here once it is ready.</p>':'<p>Your planner is being prepared. Check here for its availability.</p>'}</section>`:''}<button type="button" class="delete-show" onclick="deleteShow()">Delete Show</button><div id="showTool" class="tool-overlay hidden" role="dialog" aria-modal="true" aria-label="Show tools"></div>`;}}

function openTool(which){activeTool=which;const s=data.shows.find(x=>x.id===selected),el=document.getElementById('showTool');if(!s||!el)return;el.classList.remove('hidden');el.innerHTML=`<div class="tool-panel"><div class="tool-head"><h2>${which==='notes'?'Show notes':'Show checklist'}</h2><button type="button" class="tool-close" onclick="closeTool()" aria-label="Close">×</button></div>${which==='notes'?`<p class="hint">Keep notes for this show before and during show day.</p><textarea id="sharedNotes" aria-label="Show notes" placeholder="Anything the team needs to know…">${esc(s.sharedNotes||'')}</textarea><button class="goldbtn" onclick="saveSharedNotes()">Save Note →</button><p class="hint">Shared with your team.</p>`:`<p class="hint">Get ready for this show.</p>${(s.checklist||[]).map((item,i)=>`<div class="checkrow"><input type="checkbox" aria-label="Complete ${esc(item.text)}" ${item.done?'checked':''} onchange="toggleCheck(${i},this.checked)"><span>${esc(item.text)}</span><button class="link" onclick="removeCheck(${i})" aria-label="Remove task">×</button></div>`).join('')||'<p class="hint">No tasks yet.</p>'}<form onsubmit="addCheck(event)"><label class="field">Add a task<input name="task" required maxlength="120" placeholder="e.g. Pack passports"></label><button class="smallbtn">+ Add Task</button></form>`}</div>`}

function saveShowDetails(e){e.preventDefault();const s=data.shows.find(x=>x.id===selected);if(!s)return;const f=e.target;const horses=[...f.querySelectorAll('input[name="horses"]:checked')].map(x=>x.value),riders=[...f.querySelectorAll('input[name="riders"]:checked')].map(x=>x.value);if(!horses.length||!riders.length){alert('Choose at least one horse and rider.');return}s.venue=f.elements.venue.value.trim();s.horses=horses;s.riders=riders;s.showLink=f.elements.showLink.value.trim();if(s.status==='draft'){s.status='submitted';data.lastSubmittedShowId=s.id;save();go('confirmed');return}save();render()}
function submitShow(){const s=data.shows.find(x=>x.id===selected);if(!s)return;if(!s.horses.length||!s.riders.length){alert('Choose at least one horse and rider before submitting.');return}s.status='submitted';data.lastSubmittedShowId=s.id;save();go('confirmed')}
function demoValidate(){const s=data.shows.find(x=>x.id===selected);if(!s||s.status!=='submitted')return;s.status='preparing';save();render()}
function demoReady(){const s=data.shows.find(x=>x.id===selected);if(!s||s.status!=='preparing')return;s.status='ready';save();render()}
function calendar(){const y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate();let days=['M','T','W','T','F','S','S'].map(d=>`<div class="day blank">${d}</div>`).join('');for(let i=0;i<first;i++)days+='<div class="day blank"></div>';for(let d=1;d<=last;d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,hits=data.shows.filter(s=>s.start<=date&&s.end>=date);days+=`<button class="day ${hits.length?(hits.every(isPast)?'past':'has'):''}" onclick="calendarDate('${date}')" title="${hits.map(s=>esc(s.name)).join(', ')}">${d}</button>`}return `<div class="calendar"><div class="month"><button onclick="shift(-1)">‹</button><strong>${month.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</strong><button onclick="shift(1)">›</button></div><div class="days">${days}</div></div><div id="dateShows" style="margin-top:16px"><p class="hint">Select a highlighted date to see its shows.</p></div>`}function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function calendarDate(date){document.getElementById('dateShows').innerHTML=data.shows.filter(s=>s.start<=date&&s.end>=date).map(showItem).join('')||'<p class="hint">No shows on this date.</p>'}function editHorse(i){editingHorse=i;go('horse')}function passportSelected(input){const status=document.getElementById('scanstatus'),preview=document.getElementById('passport-preview'),file=input.files&&input.files[0];if(!file)return;if(status)status.textContent='Passport photo selected. Check and enter the details below.';if(preview){if(preview.dataset.url)URL.revokeObjectURL(preview.dataset.url);const url=URL.createObjectURL(file);preview.dataset.url=url;preview.src=url;preview.hidden=false;}}function saveHorse(e){e.preventDefault();const f=e.target.elements;const h={registeredName:f.registeredName.value.trim(),stableName:f.stableName.value.trim(),ueln:f.ueln.value.trim(),vaccination:f.vaccination.value,fei:f.fei.value.trim(),bs:f.bs.value.trim()};if(!h.registeredName)return;if(editingHorse===null)data.horses.push(h);else {const old=registeredName(data.horses[editingHorse]);data.horses[editingHorse]=h;if(old!==h.registeredName)data.shows.forEach(s=>s.horses=s.horses.map(n=>n===old?h.registeredName:n))}save();go('team')}function addTeam(e,k){e.preventDefault();const name=e.target.elements.name.value.trim();if(name&&!data[k].includes(name)){data[k].push(name);save()}render()}function saveRider(e){e.preventDefault();const f=e.target.elements,r={name:f.name.value.trim(),bs:f.bs.value.trim(),fei:f.fei.value.trim()};if(!r.name)return;if(editingRider===null)data.riders.push(r);else{const old=riderName(data.riders[editingRider]);data.riders[editingRider]=r;if(old!==r.name)data.shows.forEach(s=>s.riders=s.riders.map(n=>n===old?r.name:n))}save();go('team')}
function deleteHorse(){
  if(editingHorse===null||!data.horses[editingHorse])return;
  const name=registeredName(data.horses[editingHorse]);
  if(!confirm('Delete '+name+' from My Team? Existing show records will be kept. This cannot be undone.'))return;
  data.horses.splice(editingHorse,1);
  editingHorse=null;save();go('team');
}
function deleteRider(){
  if(editingRider===null||!data.riders[editingRider])return;
  const name=riderName(data.riders[editingRider]);
  if(!confirm('Delete '+name+' from My Team? Existing show records will be kept. This cannot be undone.'))return;
  data.riders.splice(editingRider,1);
  editingRider=null;save();go('team');
}
function deleteShow(){const s=data.shows.find(x=>x.id===selected);if(!s)return;if(!confirm('Delete '+s.name+'? This removes the show, its checklist and notes for everyone on the team. This cannot be undone.'))return;data.shows=data.shows.filter(x=>x.id!==selected);if(data.lastSubmittedShowId===selected)data.lastSubmittedShowId=null;selected=null;activeTool=null;save();go('home')}function addShow(e){e.preventDefault();if(monthlyCount()>=4){alert('You have created all 4 planners for this month.');return}const f=e.target.elements;if(f.end.value<f.start.value){alert('End date must be on or after start date.');return}const horses=[...e.target.querySelectorAll('input[name="horses"]:checked')].map(x=>x.value),riders=[...e.target.querySelectorAll('input[name="riders"]:checked')].map(x=>x.value);if(!horses.length||!riders.length){alert('Choose at least one horse and rider.');return}const s={id:Date.now(),name:f.name.value.trim(),start:f.start.value,end:f.end.value,horses,riders,venue:f.venue.value.trim(),showLink:f.showLink.value.trim(),status:'draft',checklist:[],sharedNotes:''};data.shows.push(s);data.lastSubmittedShowId=s.id;data.plannerCreations.push(creationMonth());save();selected=s.id;activeTool=null;go('show')}
startTeam();
