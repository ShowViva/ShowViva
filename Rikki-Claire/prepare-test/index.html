<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowViva — Your show co-pilot</title><style>:root{--navy:#192e47;--gold:#bd9b60;--cream:#fbf8f1;--line:#e8dfd0;--muted:#726e67}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:2px}.brand{display:flex;align-items:center;gap:10px}.brand .crest{width:35px;height:39px;flex:none}.brand .crest text{font-family:Georgia,serif;font-size:16px;font-weight:bold;letter-spacing:-1px}header button{background:none;border:0;color:#fff;font-size:22px}main{max-width:680px;margin:auto;padding:27px 20px 70px}.eyebrow{font-size:11px;letter-spacing:2px;color:#977b4c;font-weight:700;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:35px;margin:9px 0}h2{font-size:25px;margin:0}p{line-height:1.5}.intro{color:var(--muted);margin:0 0 28px}.next{background:var(--navy);color:white;border-radius:13px;padding:24px;margin:20px 0 22px}.next .eyebrow{color:#e0c68e}.next h2{font-size:31px;margin:13px 0 4px}.next p{color:#e5e3de;margin:4px 0 22px}.goldbtn{border:0;background:var(--gold);color:var(--navy);font-weight:700;border-radius:7px;padding:14px 18px;width:100%}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#f3ecdf;border:1px solid var(--line);border-radius:11px;padding:19px;text-align:left;color:var(--navy);min-height:117px}.tile .symbol{font-size:24px;color:#977b4c}.tile strong{display:block;font-family:Georgia,serif;font-size:22px;font-weight:400;margin:10px 0 4px}.tile small{color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:30px 0 13px}.link{border:0;background:none;color:#8d7042;font-weight:700}.item{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;background:#fffdf9;border:1px solid var(--line);border-radius:9px;padding:16px;margin:9px 0;color:var(--navy)}.item strong{display:block;font-size:15px}.item small{display:block;color:var(--muted);margin-top:5px}.arrow{font-size:23px;color:#9e8255}.back{background:none;border:0;color:#8d7042;padding:0;margin-bottom:22px}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;margin:20px 0}.smallbtn{background:var(--navy);color:white;border:0;border-radius:7px;padding:11px 15px}.toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.toggle button{background:transparent;border:0;padding:10px 14px;color:var(--navy)}.toggle .active{background:var(--navy);color:white}.calendar{background:white;border:1px solid var(--line);border-radius:10px;padding:13px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.month button{border:0;background:none;color:var(--navy);font-size:22px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{text-align:center;padding:10px 0;font-size:13px;border:0;border-radius:5px;background:#f6f0e6;color:var(--navy);min-height:36px}.day.has{background:#d8c29b;font-weight:700}.day.blank{background:none}.field{display:block;margin:16px 0;font-size:13px;font-weight:700}.field input,.field select{display:block;width:100%;padding:13px;margin-top:7px;border:1px solid #d7cbb8;border-radius:7px;background:white;color:var(--navy)}.hint{color:var(--muted);font-size:13px}.empty{padding:22px;background:#f3ecdf;border-radius:10px;color:var(--muted)}.pill{display:inline-block;background:#f3ecdf;border-radius:30px;padding:7px 11px;margin:5px 5px 5px 0;font-size:13px}.subhead{font-size:18px;margin-top:26px}.hidden{display:none!important}@media(max-width:360px){main{padding:22px 15px}.tile{padding:13px}.tile strong{font-size:20px}}</style><style id="header-override">.site-header{display:block;background:#1b2c3a;color:#fff;padding:28px 22px 30px}.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand-lockup{min-width:0}.brand-wordmark{font-family:Georgia,serif;font-size:clamp(29px,6vw,44px);letter-spacing:-1.7px;white-space:nowrap}.brand-wordmark span{color:#e7c17b}.brand-tagline{font-size:clamp(8px,1.7vw,12px);letter-spacing:2.7px;margin-top:7px;white-space:nowrap}.header-actions{display:flex;gap:7px}.site-header .header-actions button{font:inherit;font-size:13px;border:1px solid #6c7780;border-radius:11px;padding:10px 11px;white-space:nowrap;background:transparent;color:#fff}.header-message{margin-top:39px}.header-message h1{font-size:clamp(36px,8.5vw,64px);margin:0;line-height:1.12;white-space:nowrap;letter-spacing:-1.6px}.header-message h1 em{color:#e7c17b;font-style:normal}.header-message p{font-family:Georgia,serif;font-size:clamp(21px,4.7vw,30px);font-weight:400;letter-spacing:-.35px;margin:19px 0 0;color:#f5f1e9}@media(max-width:390px){.site-header{padding:24px 16px 28px}.header-actions{gap:4px}.site-header .header-actions button{font-size:11px;padding:9px 7px}.brand-tagline{letter-spacing:1.5px}.header-message{margin-top:34px}.header-message p{font-size:21px}}</style><style>.tiles{margin-top:18px}.tile{background:#192e47;color:#fff;border:0;min-height:132px}.tile .symbol{color:#e7c17b}.tile small{color:#e9dfce}.next{margin-top:25px}.sectionhead{margin-top:34px}@media(max-width:390px){.tile{padding:16px 12px}.tile strong{font-size:21px}}</style><style id="showviva-refinement">

.scanrow{display:flex;align-items:center;gap:11px;margin:16px 0 12px}.scan-trigger{border:1px solid #d9c9aa;background:#fffefa;color:#a68a57;width:43px;height:43px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}.scan-trigger svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.scan-label{color:var(--navy);font-size:14px;font-weight:600;cursor:pointer}.scan-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.scan-status{font-size:12px;color:var(--muted);margin:0 0 12px 54px}.scan-preview{max-width:100%;max-height:200px;object-fit:contain;border-radius:8px;margin:5px 0 10px 54px}.horsecard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fffefa;border-radius:10px;padding:15px;margin:9px 0;color:var(--navy)}.horsecard small{display:block;color:var(--muted);margin-top:5px}.horse-actions{display:flex;gap:10px;margin:15px 0}.horse-actions button{flex:1}.notice{background:#f3ecdf;border-radius:8px;padding:12px;font-size:13px;color:var(--navy)}</style><style id="showviva-gold-detail">

</style><style id="showviva-show-journey">.show-journey{margin-top:26px;padding:21px;border:1px solid #d8c59f;background:#fffefa;border-radius:12px}.show-journey .intro{margin:10px 0 18px}.show-stage{border-top:1px solid #e8dfd0;padding:15px 0 8px}.show-stage strong{font-family:Georgia,serif;font-size:20px;font-weight:400}.show-stage p{font-size:14px;color:#726e67;margin:7px 0}.show-journey .goldbtn{margin-top:14px}</style></head><body><header class="site-header"><div class="header-top"><div class="brand-lockup"><div class="brand-wordmark">Show<span>Viva</span></div><div class="brand-tagline">EQUESTRIAN SHOWS, SIMPLIFIED</div></div><nav class="header-actions" aria-label="Account"><button type="button" onclick="go('home')">⌂ Home</button><button type="button" onclick="signOut()">Sign out</button></nav></div><div class="header-message"><h1>Shows made <em>simple.</em></h1><p>Plan. Prepare. Compete.</p></div></header><main id="app"><div class="eyebrow">Your ShowViva</div><div class="tiles"><button class="tile" onclick="go('plan')"><span class="symbol">▦</span><strong>My Plan</strong><small>Get organised</small></button><button class="tile" onclick="go('team')"><span class="symbol">♧</span><strong>My Team</strong><small>Horses &amp; riders</small></button></div><section class="next"><div class="eyebrow">Up next</div><h2>Wales and West</h2><p>16–18 October</p><button class="goldbtn" onclick="openShow(1)">Open Show →</button></section><div class="sectionhead"><h2>Upcoming Shows</h2><button class="link" onclick="mode='list';go('plan')">View all →</button></div><button class="item" onclick="openShow(2)"><span><strong>Suffolk Equestrian</strong><small>11–12 November</small></span><span class="arrow">›</span></button><button class="item" onclick="openShow(3)"><span><strong>Arena UK</strong><small>25–30 November</small></span><span class="arrow">›</span></button></main><script>function signOut(){alert('Sign out will be connected when this prototype is integrated with your live account.');}
const KEY='showviva-demo-v1';const initial={shows:[{id:1,name:'Wales and West',start:'2026-10-16',end:'2026-10-18',horses:[],riders:[]},{id:2,name:'Suffolk Equestrian',start:'2026-11-11',end:'2026-11-12',horses:[],riders:[]},{id:3,name:'Arena UK',start:'2026-11-25',end:'2026-11-30',horses:[],riders:[]}],horses:[],riders:[]};let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial}catch{data=initial}if(!data||!Array.isArray(data.shows)||!Array.isArray(data.horses)||!Array.isArray(data.riders))data=initial;data.shows.forEach(s=>{if(!s.status)s.status='draft'});let editingHorse=null;let view='home',mode='calendar',month=new Date(2026,9,1),selected=null;const app=document.getElementById('app');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){/* Local files may block storage. */}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});const dates=s=>fmt(s.start)+(s.end&&s.end!==s.start?' – '+fmt(s.end):'');const horseName=h=>typeof h==='string'?h:(h.stableName||h.registeredName);const registeredName=h=>typeof h==='string'?h:h.registeredName;const ordered=()=>[...data.shows].sort((a,b)=>a.start.localeCompare(b.start));const statusLabel=s=>s.status==='ready'?'Planner ready':s.status==='preparing'?'Planner being prepared':s.status==='submitted'?'Submitted for validation':'Show details';const showItem=s=>`<button class="item" onclick="openShow(${s.id})"><span><strong>${esc(s.name)}</strong><small>${dates(s)} · ${statusLabel(s)}</small></span><span class="arrow">›</span></button>`;const back=()=>`<button class="back" onclick="go('home')">← Home</button>`;function go(v){view=v;render();scrollTo(0,0)}function openShow(id){selected=Number(id);go('show')}function render(){if(view==='home'){const shows=ordered(),next=shows.find(s=>s.end>=new Date().toISOString().slice(0,10))||shows[0];app.innerHTML=`<div class="eyebrow">Your ShowViva</div><div class="tiles"><button class="tile" onclick="go('plan')"><span class="symbol">▦</span><strong>My Plan</strong><small>Get organised</small></button><button class="tile" onclick="go('team')"><span class="symbol">♧</span><strong>My Team</strong><small>Horses & riders</small></button></div>${next?`<section class="next"><div class="eyebrow">Up next</div><h2>${esc(next.name)}</h2><p>${dates(next)}</p><button class="goldbtn" onclick="${next.status==='ready'&&Number(next.id)===1?'window.location.href=&quot;planner.html&quot;':'openShow('+next.id+')'}">${next.status==='ready'&&Number(next.id)===1?'Open Planner →':'Open Show →'}</button></section>`:''}<div class="sectionhead"><h2>Upcoming Shows</h2><button class="link" onclick="mode='list';go('plan')">View all →</button></div>${shows.filter(s=>s.id!==next?.id && s.end>=new Date().toISOString().slice(0,10)).slice(0,5).map(showItem).join('')||'<p class="hint">Your upcoming shows will appear here.</p>'}`}
else if(view==='plan'){app.innerHTML=`${back()}<h1>My Plan</h1><p class="intro">Your competitions, all in one place.</p><div class="toolbar"><button class="smallbtn" onclick="go('add')">+ Add Show</button><div class="toggle"><button class="${mode==='calendar'?'active':''}" onclick="mode='calendar';render()">Calendar</button><button class="${mode==='list'?'active':''}" onclick="mode='list';render()">List</button></div></div>${mode==='calendar'?calendar():ordered().map(showItem).join('')||'<p class="empty">No shows yet. Add your first show above.</p>'}`}
else if(view==='team'){app.innerHTML=`${back()}<h1>My Team</h1><p class="intro">Your horses and riders, ready for every competition.</p><h2 class="subhead">My Horses</h2>${data.horses.map((h,i)=>`<button class="horsecard" onclick="editHorse(${i})"><strong>${esc(horseName(h))}</strong><small>${esc(registeredName(h))}${typeof h==='object'&&h.ueln?' · UELN '+esc(h.ueln):''} · Edit →</small></button>`).join('')||'<p class="hint">No horses added yet.</p>'}<button class="smallbtn" onclick="editingHorse=null;go('horse')">+ Add Horse</button><h2 class="subhead">My Riders</h2>${data.riders.map(n=>`<span class="pill">${esc(n)}</span>`).join('')||'<p class="hint">No riders added yet.</p>'}<form onsubmit="addTeam(event,'riders')"><label class="field">Add rider<input name="name" required maxlength="80" placeholder="Rider name"></label><button class="smallbtn">+ Add Rider</button></form>`}
else if(view==='horse'){const h=editingHorse===null?{}:data.horses[editingHorse]||{},obj=typeof h==='string'?{registeredName:h}:h;const field=(label,name,type='text',required=false)=>`<label class="field">${label}<input name="${name}" type="${type}" ${required?'required':''} value="${esc(obj[name]||'')}" ${type==='text'?'maxlength="100"':''}></label>`;app.innerHTML=`<button class="back" onclick="go('team')">← My Team</button><h1>${editingHorse===null?'Add Horse':'Edit Horse'}</h1><div class="scanrow"><label for="passport-photo" class="scan-trigger" aria-label="Tap to scan passport details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></label><label for="passport-photo" class="scan-label">Tap to scan passport details</label><input class="scan-file" id="passport-photo" type="file" accept="image/*" capture="environment" onchange="passportSelected(this)"></div><p id="scanstatus" class="scan-status" role="status"></p><img id="passport-preview" class="scan-preview" alt="Selected passport photo" hidden><p class="hint">Or enter details manually</p><form onsubmit="saveHorse(event)">${field('Registered name','registeredName','text',true)}${field('Stable name','stableName')}${field('Passport / UELN number','ueln')}${field('Last vaccination date','vaccination','date')}${field('FEI registration number','fei')}${field('British Showjumping (BS) number','bs')}<p class="hint">Only registered name is required. Check all details against the passport before saving.</p><button class="goldbtn">Save Horse →</button></form>`}
else if(view==='add'){app.innerHTML=`<button class="back" onclick="go('plan')">← My Plan</button><h1>Add Show</h1><p class="intro">Choose your competition and select your horses and riders.</p><form onsubmit="addShow(event)"><label class="field">Show name<input name="name" required maxlength="100" placeholder="Competition name"></label><label class="field">Start date<input name="start" type="date" required></label><label class="field">End date<input name="end" type="date" required></label><label class="field">Horses<select name="horses" multiple size="${Math.max(2,Math.min(5,data.horses.length))}">${data.horses.map(x=>`<option value="${esc(registeredName(x))}">${esc(horseName(x))}</option>`).join('')}</select></label><label class="field">Riders<select name="riders" multiple size="${Math.max(2,Math.min(5,data.riders.length))}">${data.riders.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><p class="hint">Select multiple names if needed. Add names under My Team first.</p><button class="goldbtn">Create Show →</button></form>`}
else if(view==='showedit'){const s=data.shows.find(x=>x.id===selected);if(!s){go('plan');return}app.innerHTML=`<button class="back" onclick="go('show')">← Show Details</button><h1>Edit Show Details</h1><p class="intro">Choose the horses and riders attending ${esc(s.name)}. Permanent horse details are managed in My Team.</p><form onsubmit="saveShowTeam(event)"><h2 class="subhead">My horses</h2>${data.horses.map(h=>{const n=registeredName(h);return `<label class="field" style="display:flex;align-items:center;gap:12px"><input type="checkbox" name="horses" value="${esc(n)}" ${s.horses.includes(n)?'checked':''} style="width:auto">${esc(horseName(h))}</label>`}).join('')||'<p class="hint">No horses saved yet.</p>'}<h2 class="subhead">My riders</h2>${data.riders.map(n=>`<label class="field" style="display:flex;align-items:center;gap:12px"><input type="checkbox" name="riders" value="${esc(n)}" ${s.riders.includes(n)?'checked':''} style="width:auto">${esc(n)}</label>`).join('')||'<p class="hint">No riders saved yet.</p>'}<button class="goldbtn">Save show team →</button></form><section class="show-journey"><h2 class="subhead">Add a horse to this show</h2><p class="hint">Adds a basic horse record to My Team. Full horse details can be edited there.</p><form onsubmit="addShowHorse(event)"><label class="field">Registered name<input name="name" required maxlength="100" placeholder="Horse name"></label><button class="smallbtn">+ Add horse to show</button></form><button class="link" onclick="go('team')">Edit horse details in My Team →</button></section>`}
else if(view==='show'){const s=data.shows.find(x=>x.id===selected);if(!s){go('home');return}app.innerHTML=`<button class="back" onclick="go('plan')">← My Plan</button><div class="eyebrow">Your show</div><h1>${esc(s.name)}</h1><p class="intro">${dates(s)}</p><div class="notice">${statusLabel(s)}</div><button class="smallbtn" onclick="go('showedit')">Edit show details →</button><h2 class="subhead">Horses</h2>${s.horses.length?s.horses.map(n=>`<span class="pill">${esc(n)}</span>`).join(''):'<p class="hint">No horses selected.</p>'}<h2 class="subhead">Riders</h2>${s.riders.length?s.riders.map(n=>`<span class="pill">${esc(n)}</span>`).join(''):'<p class="hint">No riders selected.</p>'}<section class="show-journey"><h2 class="subhead">Your show</h2><p class="intro">Choose your team, submit your show and access your planner here when ready.</p>${s.status==='draft'?'<button class="goldbtn" onclick="submitShow()">Submit show →</button>':s.status==='submitted'?'<p class="hint">Submitted for validation. We’ll check that this is an Equipe show before preparation begins.</p>':s.status==='preparing'?'<p class="hint">Your planner is being prepared. You can still change your show team.</p>':Number(s.id)===1?'<button class="goldbtn" onclick="window.location.href=&quot;planner.html&quot;">Open Planner →</button>':'<p class="hint">Your planner will appear here when ready.</p>'}</section>${Number(s.id)===1&&s.status==='submitted'?'<button class="smallbtn" onclick="demoValidate()">TEST ONLY · Validate Equipe show →</button>':''}${Number(s.id)===1&&s.status==='preparing'?'<button class="smallbtn" onclick="demoReady()">TEST ONLY · Mark planner ready →</button>':''}`}}
function submitShow(){const s=data.shows.find(x=>x.id===selected);if(!s)return;if(!s.horses.length||!s.riders.length){alert('Choose at least one horse and rider before submitting.');return}s.status='submitted';save();render()}
function demoValidate(){const s=data.shows.find(x=>x.id===selected);if(!s||s.status!=='submitted')return;s.status='preparing';save();render()}
function demoReady(){const s=data.shows.find(x=>x.id===selected);if(!s||s.status!=='preparing')return;s.status='ready';save();render()}
function saveShowTeam(e){e.preventDefault();const s=data.shows.find(x=>x.id===selected);if(!s)return;const f=e.target;s.horses=[...f.querySelectorAll('input[name="horses"]:checked')].map(x=>x.value);s.riders=[...f.querySelectorAll('input[name="riders"]:checked')].map(x=>x.value);save();go('show')}function addShowHorse(e){e.preventDefault();const s=data.shows.find(x=>x.id===selected);if(!s)return;const name=e.target.elements.name.value.trim();if(!name)return;if(!data.horses.some(h=>registeredName(h)===name))data.horses.push({registeredName:name});if(!s.horses.includes(name))s.horses.push(name);save();go('showedit')}function calendar(){const y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate();let days=['M','T','W','T','F','S','S'].map(d=>`<div class="day blank">${d}</div>`).join('');for(let i=0;i<first;i++)days+='<div class="day blank"></div>';for(let d=1;d<=last;d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,hits=data.shows.filter(s=>s.start<=date&&s.end>=date);days+=`<button class="day ${hits.length?'has':''}" onclick="calendarDate('${date}')" title="${hits.map(s=>esc(s.name)).join(', ')}">${d}</button>`}return `<div class="calendar"><div class="month"><button onclick="shift(-1)">‹</button><strong>${month.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</strong><button onclick="shift(1)">›</button></div><div class="days">${days}</div></div><div id="dateShows" style="margin-top:16px">${ordered().filter(s=>s.start.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).map(showItem).join('')||'<p class="hint">No shows starting this month.</p>'}</div>`}function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function calendarDate(date){document.getElementById('dateShows').innerHTML=data.shows.filter(s=>s.start<=date&&s.end>=date).map(showItem).join('')||'<p class="hint">No shows on this date.</p>'}function editHorse(i){editingHorse=i;go('horse')}function passportSelected(input){const status=document.getElementById('scanstatus'),preview=document.getElementById('passport-preview'),file=input.files&&input.files[0];if(!file)return;if(status)status.textContent='Passport photo selected. Check and enter the details below.';if(preview){if(preview.dataset.url)URL.revokeObjectURL(preview.dataset.url);const url=URL.createObjectURL(file);preview.dataset.url=url;preview.src=url;preview.hidden=false;}}function saveHorse(e){e.preventDefault();const f=e.target.elements;const h={registeredName:f.registeredName.value.trim(),stableName:f.stableName.value.trim(),ueln:f.ueln.value.trim(),vaccination:f.vaccination.value,fei:f.fei.value.trim(),bs:f.bs.value.trim()};if(!h.registeredName)return;if(editingHorse===null)data.horses.push(h);else {const old=registeredName(data.horses[editingHorse]);data.horses[editingHorse]=h;if(old!==h.registeredName)data.shows.forEach(s=>s.horses=s.horses.map(n=>n===old?h.registeredName:n))}save();go('team')}function addTeam(e,k){e.preventDefault();const name=e.target.elements.name.value.trim();if(name&&!data[k].includes(name)){data[k].push(name);save()}render()}function addShow(e){e.preventDefault();const f=e.target.elements;if(f.end.value<f.start.value){alert('End date must be on or after start date.');return}const pick=k=>Array.from(f[k].selectedOptions).map(o=>o.value);const s={id:Date.now(),name:f.name.value.trim(),start:f.start.value,end:f.end.value,horses:pick('horses'),riders:pick('riders'),status:'draft'};data.shows.push(s);save();openShow(s.id)}try{render()}catch(e){console.error('ShowViva render failed',e)}
</script></body></html>
