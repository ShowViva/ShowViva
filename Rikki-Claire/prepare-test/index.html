/* My Team: collapsible roster groups only; existing cards and actions unchanged. */
#app.sv-view-team .sv-roster-fold{border:1px solid #d5bc8d;border-radius:18px;background:#fffefa;overflow:hidden;margin-bottom:16px}
#app.sv-view-team .sv-roster-fold>summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px;cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
#app.sv-view-team .sv-roster-fold>summary::-webkit-details-marker{display:none}
#app.sv-view-team .sv-roster-fold>summary .subhead{margin:0}
#app.sv-view-team .sv-roster-chevron{width:11px;height:11px;flex:none;border-right:2px solid #a98a52;border-bottom:2px solid #a98a52;transform:rotate(45deg);transition:transform .2s ease;margin-right:5px}
#app.sv-view-team .sv-roster-fold[open] .sv-roster-chevron{transform:rotate(225deg)}
#app.sv-view-team .sv-roster-fold-content{padding:0 16px 18px}
#app.sv-view-team .sv-roster-fold>summary:focus-visible{outline:2px solid #a98a52;outline-offset:-3px}

/* ShowViva simplified saved-show UI */
.sv-view-show .sv-entries-overview{padding:28px 30px}
.sv-view-show .sv-entries-overview>.sv-support{display:none}
.sv-view-show .sv-class-summary{margin-top:4px}
.sv-view-show .sv-class-summary h3{font-size:1.1rem;margin-bottom:12px}
.sv-view-show .sv-entry-confirm{margin-top:18px;padding:14px 16px;background:#fbf8f1;border-radius:16px}
.sv-view-show .sv-planner-simple{text-align:left}
.sv-view-show .sv-planner-simple .sv-primary-planner{display:block;text-align:center;text-decoration:none;margin-top:18px}
.sv-view-show .sv-refresh-link{display:block;margin:14px auto 0;border:0;background:transparent;color:#6d6252;text-decoration:underline;text-underline-offset:3px;font:inherit;padding:8px 12px;cursor:pointer}
.sv-view-show .sv-manage-show{margin-top:22px}
.sv-view-show .sv-manage-show>summary{padding:24px 30px}
.sv-view-show .sv-manage-show .sv-checklist-title{font-size:1.25rem}

  --sv-gold-primary:#dfb866;
  --sv-gold-accent:#96743d;
  --sv-gold-border:#dcc79c;
}

/* Hard-lock the SAME navy on Home, Calendar, Notes and every other internal view. */
html body header,
html body .site-header,
html body .site-header.sv-header-home,
html body:has(#app.sv-view-plan) .site-header,
html body:has(#app.sv-view-notebook) .site-header{
  background:#10283a!important;
  background-color:#10283a!important;
  background-image:none!important;
}
html body .site-header .header-top,
html body .site-header .brand-lockup,
html body .site-header .header-actions{
  background:transparent!important;
}
html body .site-header .header-actions .calendar-nav,
html body .site-header .header-actions .notebook-nav,
html body .site-header.sv-header-home .header-actions .calendar-nav,
html body .site-header.sv-header-home .header-actions .notebook-nav{
  background:#10283a!important;
  background-color:#10283a!important;
  background-image:none!important;
  border:1.5px solid #dcc79c!important;
  color:#e6bf78!important;
  box-shadow:none!important;
}

/* The 3 primary Home actions must never overflow on a phone. */
#app.sv-view-home .sv-home-primary-actions{
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:8px!important;
}
#app.sv-view-home .sv-home-action{
  min-width:0!important;
  overflow:hidden!important;
  padding:13px 10px 12px!important;
}
#app.sv-view-home .sv-home-action strong{
  display:block!important;
  width:100%!important;
  max-width:100%!important;
  white-space:normal!important;
  overflow-wrap:normal!important;
  word-break:normal!important;
  hyphens:none!important;
  font-size:clamp(15.5px,4.1vw,18px)!important;
  line-height:1.08!important;
}
#app.sv-view-home .sv-home-action small{
  display:block!important;
  width:100%!important;
  max-width:100%!important;
  white-space:normal!important;
  overflow-wrap:normal!important;
  word-break:normal!important;
  font-size:clamp(11.5px,3vw,13px)!important;
  line-height:1.25!important;
}
#app.sv-view-home .sv-home-action-icon,
#app.sv-view-home .sv-home-action-icon svg{
  width:23px!important;
  height:23px!important;
}

/* Give wrapped labels enough room while keeping the row premium and even. */
@media(max-width:430px){
  #app.sv-view-home .sv-home-action{
    min-height:112px!important;
  }
  #app.sv-view-home .sv-home-action strong{
    font-size:16px!important;
  }
  #app.sv-view-home .sv-home-action small{
    font-size:12px!important;
  }
}
@media(max-width:365px){
  #app.sv-view-home .sv-home-primary-actions{gap:6px!important}
  #app.sv-view-home .sv-home-action{
    padding-left:8px!important;
    padding-right:8px!important;
  }
  #app.sv-view-home .sv-home-action strong{font-size:15px!important}
  #app.sv-view-home .sv-home-action small{font-size:11px!important}
}
</style>

const KEY='showviva-demo-v1';

const teamApi=async(method,payload)=>{
  const controller=new AbortController();

  try{
    const result=await fetch(TEAM_API,{method,headers:{'Content-Type':'application/json','x-team-token':TEAM_TOKEN},body:payload?JSON.stringify(payload):undefined,cache:'no-store',signal:controller.signal});

const SV_PREP_DEFAULTS=['Vaccinations & passports','Stabling & bedding (if staying overnight)','Yard cover','Hay, feed & supplements','Tack, boots & rugs','Show clothes, hats, gloves, whips & spurs','Grooming kit & buckets','Water','Dog food, human food & alcohol','Lorry checked & fuelled'];
const SV_OLD_DEFAULTS=new Set(['Stabling booked','Farrier booked','Transport arranged','Accommodation booked','Passports and vaccinations checked','Tack and equipment','Rugs and horse boots','Feed, hay and supplements','Buckets and stable equipment','Passports','Rider and groom equipment','Lorry or trailer checked and fuelled','Water']);
function ensureShowLists(s){
 if(!Array.isArray(s.prepChecklist)){
  const old=[...(Array.isArray(s.planningChecklist)?s.planningChecklist:[]),...(Array.isArray(s.packingChecklist)?s.packingChecklist:[])];
  const done=(...names)=>names.some(n=>old.some(t=>t.text===n&&t.done));
  s.prepChecklist=SV_PREP_DEFAULTS.map((text,i)=>({text,done:[
   done('Passports and vaccinations checked','Passports'),done('Stabling booked'),false,
   done('Feed, hay and supplements'),done('Tack and equipment','Rugs and horse boots'),
   done('Rider and groom equipment'),done('Buckets and stable equipment'),done('Water'),false,
   done('Lorry or trailer checked and fuelled')][i]}));
  // Retain any team-created tasks; do not silently discard their work.
  for(const t of old)if(t&&t.text&&!SV_OLD_DEFAULTS.has(t.text)&&!s.prepChecklist.some(x=>x.text===t.text))s.prepChecklist.push({text:t.text,done:!!t.done});
 }
 if(!s.plannedClasses)s.plannedClasses={};
}
function showTasks(s,kind){const list=s.prepChecklist;return `<div>${list.map((t,i)=>`<div class="sv-task"><input type="checkbox" aria-label="${esc(t.text)}" ${t.done?'checked':''} onchange="setTask('${kind}',${i},this.checked)"><span class="sv-task-label" id="sv-${kind}-${i}">${esc(t.text)}</span><button type="button" onclick="editTask('${kind}',${i})" aria-label="Edit ${esc(t.text)}">Edit</button><button type="button" onclick="removeTask('${kind}',${i})" aria-label="Remove ${esc(t.text)}">×</button></div>`).join('')}</div><form class="sv-task-form" onsubmit="addShowTask(event,'${kind}')"><input name="task" aria-label="Add ${kind} task" maxlength="120" required placeholder="Add your own task…"><button type="submit">+ Add</button></form>`}
function taskList(kind){const s=data.shows.find(x=>x.id===selected);ensureShowLists(s);return s.prepChecklist}
function setTask(kind,i,done){const t=taskList(kind)[i];if(!t)return;t.done=done;save()}
function removeTask(kind,i){taskList(kind).splice(i,1);save();render()}
function editTask(kind,i){const t=taskList(kind)[i];if(!t)return;const next=prompt('Edit checklist item',t.text);if(next===null)return;const val=next.trim();if(!val)return;t.text=val.slice(0,120);save();render()}
function addShowTask(e,kind){e.preventDefault();const val=e.target.elements.task.value.trim();if(!val)return;taskList(kind).push({text:val.slice(0,120),done:false});save();render()}
async function saveShowAndGoHome(button){
 if(button?.disabled)return;
 if(button){button.disabled=true;button.textContent='Saving…';}
 const notes=document.getElementById('sv-show-notes');
 const show=data.shows.find(x=>x.id===selected);
 if(notes&&show&&show.sharedNotes!==notes.value){show.sharedNotes=notes.value;save();}
 // Allow an earlier asynchronous write to finish before returning to Home.
 await teamPending;
 if(teamError){if(button){button.disabled=false;button.textContent='Save & return Home →';}return;}
 go('home');
}

let svEditingNoteIndex=null;
function capitolNotes(){
 if(data.teamNotebookV3)return data.teamNotebookNotes||[];
 if(data.teamNotebookConsolidated&&data.teamNotes?.trim())return [{id:'capitol-legacy',text:data.teamNotes,author:null,createdAt:null}];
 if(Array.isArray(data.teamNotebookNotes)&&data.teamNotebookNotes.length)return data.teamNotebookNotes;
 return data.teamNotes?.trim()?[{id:'capitol-legacy',text:data.teamNotes,author:null,createdAt:null}]:[];
}
function prepareCapitolNotes(){
 if(data.teamNotebookV3)return;
 const current=capitolNotes().map(n=>({...n}));
 // Retain the old records in storage, even if the consolidated text replaced their display.
 if(!data.teamNotebookArchiveV3)data.teamNotebookArchiveV3=structuredClone(data.teamNotebookNotes||[]);
 data.teamNotebookNotes=current;data.teamNotebookV3=true;
}
async function addCapitolNote(e){
 e.preventDefault();if(teamError)return;
 const f=e.target, author=f.elements.author.value, text=f.elements.note.value.trim();
 if(!capitolAuthorNames().includes(author)||!text)return;
 const btn=f.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Saving…';
 prepareCapitolNotes();data.teamNotebookNotes.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),author,text,createdAt:new Date().toISOString()});
 save();await teamPending;if(teamError){btn.disabled=false;btn.textContent='Add note';return;}
 render();
}
async function saveCapitolEdit(e,i){
 e.preventDefault();if(teamError)return;const text=e.target.elements.note.value.trim();if(!text)return;
 prepareCapitolNotes();const n=data.teamNotebookNotes[i];if(!n)return;
 if(n.text!==text){n.text=text;n.editedAt=new Date().toISOString();save();await teamPending;}
 if(!teamError){svEditingNoteIndex=null;render();}

    if(window.__svSuppressNextToast){window.__svSuppressNextToast=false;return;}
    const el=ensureToast();
    el.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>el.classList.remove('show'),1400);
  }
  document.addEventListener('click',function(e){
    const el=e.target&&e.target.closest?e.target.closest('button,[role="button"]'):null;
    if(!el)return;
    const t=(el.textContent||'').trim().toLowerCase();
    const explicitSave = t.includes('save show') || t.includes('save changes') || t==='add note' || t.includes('save note') || t.includes('save horse') || t.includes('save rider') || t.includes('save member');
    if(explicitSave) setTimeout(showSaved,250);
  },true);
  document.addEventListener('DOMContentLoaded',ensureToast);
})();
</script>
